<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catch · touch-up comparison</title>
<style>
body{margin:0;background:#1b1a18;color:#e9e3d6;font:15px/1.45 Georgia,serif;padding:22px 16px 40px}
h1{font-weight:400;font-size:22px;margin:0 0 4px} p.lede{margin:0 0 22px;color:#bdb4a2;max-width:640px}
section{background:#24221f;border:1px solid #3a3631;border-radius:8px;padding:14px 14px 18px;margin:0 0 18px;max-width:900px}
section h2{font-weight:400;font-size:18px;margin:0 0 2px} section p{margin:0 0 14px;color:#bdb4a2;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{border:1px solid #3a3631;border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.opt h3{font-weight:400;font-size:14px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:#d8cfbd}
.opt.now h3::after{content:" (current)";text-transform:none;letter-spacing:0;color:#9d9483}
.sizes{display:flex;align-items:center;gap:14px}
.cap{font-size:11px;color:#9d9483;text-align:center;margin-top:6px} .gh.big + .cap{margin-top:18px}
/* Dispatch stamp, as in the app */
.dp{width:86px;height:100px;background:radial-gradient(circle,transparent 2.4px,#BFB493 2.8px) -3.5px -3.5px/7px 7px;position:relative;flex:none}
.dp i{position:absolute;inset:6px;background:#393D3C;display:flex;align-items:center;justify-content:center;color:#BFB493}
.dp svg{width:74px;height:62px;fill:none;stroke:#BFB493;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.dp.big{width:172px;height:200px;background-size:14px 14px;background-position:-7px -7px} .dp.big i{inset:12px} .dp.big svg{width:148px;height:124px}
/* Green Hall book medallion, as in the app */
.gh{width:26px;height:26px;border-radius:50%;background:#A9B29A;border:1.1px solid #142420;box-shadow:0 0 0 3px #4E6352,0 0 0 4px #9A8760;display:flex;align-items:center;justify-content:center;color:#423C2D;flex:none}
.gh svg{width:21px;height:18px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gh.big{width:120px;height:120px;border-width:2px;box-shadow:0 0 0 10px #4E6352,0 0 0 12px #9A8760} .gh.big svg{width:96px;height:80px}
@media (max-width:640px){ .opts{grid-template-columns:1fr} }
</style></head><body>
<h1>Touch-up comparison</h1>
<p class="lede">Each row shows the current drawing next to two new options, at the size it really appears in the app and enlarged. Pick one per row, or keep the current one. Nothing changes in the app until you choose.</p>
<div id="rows"></div>
<script src="../motifs.js?v=2"></script><script src="gh-1.js"></script><script src="gh-2.js"></script><script src="dp-1.js"></script><script src="dp-2.js"></script><script src="touchups.js"></script>
<script>
const D = window.DPDraw || {}, G = window.GHEmblem || {}, T = window.TouchUps;
const dp = (svg, big) => `<div class="dp${big ? ' big' : ''}"><i><svg viewBox="0 0 62 52">${svg}</svg></i></div>`;
const gh = (svg, big) => `<div class="gh${big ? ' big' : ''}"><svg viewBox="0 0 64 52">${svg}</svg></div>`;
const rows = [
  ['Dispatch · “key” stamp', 'Used for links that don’t match any other subject, so it appears often. The current key (with its ribbon) is thin and squeezed into a strip across the middle.', dp,
    [['Now', D.key], ['Option A', T.dpKeyA], ['Option B', T.dpKeyB]], ['bigger, round bow', 'bigger, ornate bow']],
  ['Green Hall · “money” emblem', 'On the book spines this is drawn very small; the purse and coins crowd each other at that size.', gh,
    [['Now', G.money], ['Option A', T.ghMoneyA], ['Option B', T.ghMoneyB]], ['money bag', 'coin stack']],
  ['Green Hall · “game” emblem', 'The die and the chess piece are both tiny and hard to read on a spine.', gh,
    [['Now', G.game], ['Option A', T.ghGameA], ['Option B', T.ghGameB]], ['game controller', 'chess knight']],
];
document.getElementById('rows').innerHTML = rows.map(([title, why, draw, opts, names]) => `<section><h2>${title}</h2><p>${why}</p><div class="opts">${
  opts.map(([label, svg], i) => `<div class="opt${i ? '' : ' now'}"><h3>${label}${i ? ' · ' + names[i-1] : ''}</h3>
    <div class="sizes"><div>${draw(svg)}<div class="cap">real size</div></div><div>${draw(svg, true)}<div class="cap">enlarged</div></div></div></div>`).join('')
}</div></section>`).join('');
</script></body></html>
