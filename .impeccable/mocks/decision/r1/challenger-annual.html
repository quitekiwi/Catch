<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Catch — The Collection Plates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#E8E4D8;--ink:#16181A;--green:#1F3B2F;--ox:#6B1E1E;--gold:#C79A3B;--hair:rgba(22,24,26,.28);--mono:"JetBrains Mono",monospace;--sans:"Bricolage Grotesque",sans-serif}
html,body{margin:0;width:390px;height:844px;overflow:hidden}
body{position:relative;color:var(--ink);font-family:var(--sans);background:
radial-gradient(120% 60% at 0 0,rgba(199,154,59,.10),transparent 55%),
radial-gradient(120% 60% at 100% 100%,rgba(31,59,47,.09),transparent 55%),
radial-gradient(90% 50% at 100% 0,rgba(31,59,47,.06),transparent 60%),
radial-gradient(90% 50% at 0 100%,rgba(199,154,59,.08),transparent 60%),var(--paper)}
.m{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.bar{position:sticky;top:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
.bar b{font-weight:500}
.mast{padding:14px 16px 0;display:flex;align-items:baseline;justify-content:space-between}
.mast h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.mast p{margin:0;font-size:12px;max-width:170px;text-align:right;line-height:1.25;color:#3a3c3c}
.find{display:flex;gap:8px;margin:12px 16px 0}
.find label{flex:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--ink);background:rgba(255,255,255,.25)}
.find input{all:unset;flex:1;font-family:var(--sans);font-size:14px}
.find input::placeholder{color:#6a6b68}
.btn{all:unset;box-sizing:border-box;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.sec{margin:18px 16px 8px;display:flex;justify-content:space-between;border-top:1px solid var(--ink);padding-top:5px}
.plate{position:relative;margin:0 16px}
.frame{position:relative;padding:10px;border:1px solid var(--hair);background:#efece2;box-shadow:0 1px 0 rgba(22,24,26,.06)}
.frame svg.art{display:block;width:100%;height:auto}
.reg{position:absolute;width:14px;height:14px;color:var(--ink)}
.tl{left:-7px;top:-7px}.tr{right:-7px;top:-7px}.bl{left:-7px;bottom:-7px}.br{right:-7px;bottom:-7px}
.stamp{position:absolute;right:-30px;top:-34px;width:96px;height:96px;transform:rotate(-12deg);mix-blend-mode:multiply}
.cred{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:baseline;margin:8px 16px 0;padding:6px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cred .t{font-size:15px;font-weight:500;letter-spacing:-.01em}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 16px}
.row .frame{padding:6px}
.row .reg{width:10px;height:10px}.row .tl{left:-5px;top:-5px}.row .tr{right:-5px;top:-5px}.row .bl{left:-5px;bottom:-5px}.row .br{right:-5px;bottom:-5px}
.cap{margin-top:7px;line-height:1.3}
.cap .t{font-size:13px;font-weight:500;display:block}
.cap .m{font-size:8px;color:#4b4d4c}
.dock{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 26px;border-top:1px solid var(--ink);background:var(--paper)}
.dock .m{display:block;margin-bottom:6px;color:#4b4d4c}
.dock form{display:flex}
.dock input{all:unset;flex:1;height:44px;padding:0 12px;border:1px solid var(--ink);border-right:0;font-family:var(--sans);font-size:15px;background:rgba(255,255,255,.35)}
.dock input::placeholder{color:#6a6b68}
.catch{height:44px;padding:0 18px;background:var(--ink);color:var(--paper);border-radius:0;font-weight:500}
</style></head>
