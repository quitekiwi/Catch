.count{position:absolute;top:149px;left:0;right:0;text-align:center;font:10.5px "Marcellus SC",serif;letter-spacing:2px;color:var(--taupe)}
.seek{display:flex;gap:8px;margin:10px 16px 0}
.seek label,.dock label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--taupe);border-radius:16px 3px 16px 3px;padding:0 12px;height:36px}
input{border:0;background:none;font:italic 14px Arapey,serif;color:var(--tan);width:100%;outline:none}
input::placeholder{color:var(--taupe)}
button{font:12px "Marcellus SC",serif;letter-spacing:2px;color:var(--tan);background:none;border:1px solid var(--taupe);border-radius:3px 16px 3px 16px;padding:0 15px;height:38px;cursor:pointer}
.cellar{position:absolute;left:0;top:222px}
.mc{font-family:"Marcellus SC",serif}
.ill{fill:none;stroke:#40101D;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dock{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--ox)}
.dock>svg{position:absolute;left:0;top:-13px}
.dock .hd{text-align:center;font:9.5px "Marcellus SC",serif;letter-spacing:2.6px;color:var(--taupe);margin:22px 0 10px}
.dock .row{display:flex;gap:8px;margin:0 16px}
.dock label{height:44px;background:rgba(26,21,25,.45)}
.dock button{height:46px;padding:0 20px;font:700 15px "Cinzel Decorative",serif;letter-spacing:1.5px;background:var(--tan);color:var(--ox);border-color:var(--tan)}
