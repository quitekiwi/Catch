.dock>svg{position:absolute;left:0;top:-13px}
.dock .hd{text-align:center;margin:22px 0 12px}
.dock .hd span{display:inline-block;background:var(--tan);color:var(--ox);font:9.5px "Marcellus SC",serif;letter-spacing:2.6px;padding:4px 14px 3px;border-radius:10px 2px 10px 2px}
.dock .row{display:flex;gap:8px;margin:0 16px}
.dock label{height:44px;background:var(--wall);border-color:var(--tan)}
.dock button{height:46px;padding:0 20px;font:700 15px "Cinzel Decorative",serif;letter-spacing:1.5px;border-color:var(--tan)}
