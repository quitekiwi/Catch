<style>
:root{--umber:#2B211B;--tobacco:#6E5644;--tan:#B89A7A;--green:#1F3B2F;--ox:#6B1E1E;--gold:#C79A3B;--paper:#EBD9BC}
html,body{margin:0;width:390px;height:844px;overflow:hidden}
body{position:relative;background:radial-gradient(120% 70% at 50% 42%,#4a382b 0%,#33271f 45%,var(--umber) 80%);color:var(--paper);font-family:"Bodoni Moda",Georgia,serif}
.head{position:absolute;top:44px;left:0;right:0;text-align:center}
.kicker{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--tan)}

.sign{display:inline-block;margin:6px 0 5px;padding:3px 22px 1px;background:var(--green);border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:3px;box-shadow:0 6px 14px rgba(0,0,0,.45)}

.tag{font-style:italic;font-size:12px;color:var(--tan)}
.search{position:absolute;top:140px;left:24px;right:24px;display:flex;gap:8px}
.field{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:rgba(20,15,11,.55);border:1px solid var(--tobacco);border-radius:3px;font-style:italic;font-size:13px;color:#a68d72}
.field svg{flex:none}
.btn{height:36px;padding:0 14px;display:flex;align-items:center;gap:6px;border:1px solid var(--gold);border-radius:3px;background:transparent;color:var(--gold);font:600 10px "Bodoni Moda",serif;letter-spacing:.22em;text-transform:uppercase}
.set{position:absolute;top:184px;left:0}
.dock{position:absolute;left:28px;right:28px;top:736px;padding:9px 9px 9px 12px;display:flex;gap:8px;align-items:center;border-radius:5px;background:linear-gradient(180deg,#e2bd66 0%,var(--gold) 40%,#9c7428 100%);box-shadow:inset 0 1px 0 #f5d995,inset 0 -2px 0 #7a5a1e,0 8px 18px rgba(0,0,0,.55)}
.dock:before,.dock:after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#7a5a1e;box-shadow:inset 0 1px 0 #f0d08a}
.dock:before{left:4px}.dock:after{right:4px}
.slot{flex:1;height:36px;display:flex;align-items:center;padding:0 12px;border-radius:2px;background:#1a130e;box-shadow:inset 0 3px 6px #000,0 1px 0 #f2d48c;font-style:italic;font-size:13px;color:#a68d72}
.catch{height:36px;padding:0 16px;border:0;border-radius:2px;background:var(--ox);color:var(--paper);font:400 15px Limelight,serif;letter-spacing:.12em;box-shadow:inset 0 1px 0 #93403a,0 1px 0 #f2d48c}
.engrave{position:absolute;top:814px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.34em;color:var(--tan);text-transform:uppercase}
.grain,.vig{position:absolute;inset:0;pointer-events:none}
.grain{mix-blend-mode:overlay;opacity:.55}
.vig{background:radial-gradient(115% 85% at 50% 48%,transparent 55%,rgba(10,6,3,.72) 100%),linear-gradient(180deg,rgba(184,120,60,.08),rgba(60,30,10,.12))}
